name: Build preprint PDF

on:
  push:
    branches:
      - research/short-relation-100m
    paths:
      - 'paper/composite_exact_typeii_depths_v11.tex'
      - '.github/workflows/build-preprint-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Compile frozen v11 LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: composite_exact_typeii_depths_v11.tex
          working_directory: paper
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Create publication copy
        run: |
          cp paper/composite_exact_typeii_depths_v11.pdf paper/Skip_Potter_Prime_Cofactor_Hierarchies_v11.pdf

      - name: Commit generated PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/composite_exact_typeii_depths_v11.pdf paper/Skip_Potter_Prime_Cofactor_Hierarchies_v11.pdf
          if git diff --cached --quiet; then
            echo 'PDFs already current.'
          else
            git commit -m 'Build frozen v11 preprint PDFs'
            git push
          fi
