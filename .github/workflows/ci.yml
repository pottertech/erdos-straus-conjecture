name: CI (Lean build + certificate verification + audit)

on:
  push:
    branches: [main, "research/short-relation-100m"]
  pull_request:
    branches: [main]

jobs:
  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          source $HOME/.elan/env
          lake --version
      - name: Build Lean project
        run: |
          source $HOME/.elan/env
          lake exe cache get || true
          lake build

  certificate-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check certificate verifier sources
        run: |
          python -m py_compile \
            analysis/layer4/verify_certificates.py \
            analysis/layer4/check_certificate_dataset.py
      - name: Verify certificate dataset when available
        shell: bash
        run: |
          if [ -f results/layer4_certificates.jsonl ]; then
            python analysis/layer4/verify_certificates.py
            python analysis/layer4/check_certificate_dataset.py
          else
            echo "::notice::results/layer4_certificates.jsonl is not versioned in this repository checkout."
            echo "::notice::PR CI validates the verifier code; scripts/audit_all.sh --strict still requires the full dataset for release/reviewer auditing."
          fi

  audit:
    runs-on: ubuntu-latest
    needs: [lean-build, certificate-verification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository policy audit
        run: |
          SKIP_LEAN_BUILD=1 bash scripts/audit_all.sh
      - name: Explain strict release gate
        run: |
          echo "Strict release/reviewer audit remains: bash scripts/audit_all.sh --strict"
          echo "That command intentionally fails if results/layer4_certificates.jsonl is absent."
