name: CI (math smoke + repo audit + Lean build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Math smoke test (exact criteria + audit counterexample regression)
        run: python scripts/smoke_test.py

  repo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Repository audit (documented Lean state + axiom whitelist;
              certificates checked when results/layer4_certificates.jsonl exists)
        run: bash scripts/audit_all.sh

  lean-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch prebuilt Mathlib cache
        run: lake exe cache get
      - name: Build Lean project (root lib + the full ten-module certified set)
        run: |
          lake build
          lake build ErdosStrausConjecture.DivisorResidue ErdosStrausConjecture.ClassicalIdentities ErdosStrausConjecture.OmegaCases ErdosStrausConjecture.CenteredEquivalence ErdosStrausConjecture.MainTheorem ErdosStrausConjecture.Theorem4 ErdosStrausConjecture.NewTheorems ErdosStrausConjecture.CenteredCriterion ErdosStrausConjecture.Reduction ErdosStrausConjecture.FiniteSearch
      - name: Proof-term axiom audit as CI regression gate (fourth external review V13-03)
        run: |
          lake env lean scripts/print_axioms.lean | tee /tmp/axioms.txt
          python3 scripts/check_axioms_audit.py < /tmp/axioms.txt
