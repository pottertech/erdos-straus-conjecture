name: Minimal binary Lean endpoint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lean-minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          source $HOME/.elan/env
          lean --version
          lake --version
      - name: Fetch pinned dependencies
        working-directory: lean-minimal
        run: |
          source $HOME/.elan/env
          lake update
          lake exe cache get || true
      - name: Build isolated binary endpoint
        working-directory: lean-minimal
        run: |
          source $HOME/.elan/env
          lake build
