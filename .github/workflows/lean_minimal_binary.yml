name: Minimal binary Lean endpoint

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lean-minimal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean-minimal
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Build isolated binary endpoint
        run: lake build
