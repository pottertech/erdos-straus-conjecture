name: Verify (Python smoke test + v11 PDF build)

on:
  push:
    branches: [main, "research/short-relation-100m"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax smoke test
        run: |
          python -m py_compile \
            fixed_cofactor_hierarchy_verifier.py \
            paper/hierarchy_constant_certificate.py \
            paper/repaired_all_prime_hierarchy_constant.py \
            paper/verify_fixed_cofactor_no_reuse_1m.py

  pdf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended
      - name: Rebuild frozen v11 PDF from TeX
        run: |
          cd paper
          pdflatex -interaction=nonstopmode -halt-on-error composite_exact_typeii_depths_v11.tex
          pdflatex -interaction=nonstopmode -halt-on-error composite_exact_typeii_depths_v11.tex
          test -s composite_exact_typeii_depths_v11.pdf
          if grep -E "LaTeX Warning:|undefined references|Overfull|Underfull" composite_exact_typeii_depths_v11.log; then
            echo "::error::v11 LaTeX build produced warnings that must be reviewed"
            exit 1
          fi
