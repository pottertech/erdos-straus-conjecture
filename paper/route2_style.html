<style>
@page { size: Letter; margin: 22mm 19mm; }
html { font-size: 10.7pt; }
body {
  font-family: "Georgia", "Times New Roman", serif;
  line-height: 1.52; color: #14120f; max-width: none; margin: 0; padding: 0;
  hyphens: auto;
}
h1 {
  font-size: 16.5pt; line-height: 1.3; margin: 0 0 0.35em 0;
  text-align: left; font-weight: 700; color: #000;
}
h1.title, header#title-block-header { display: none; }
h2 {
  font-size: 12.4pt; margin: 1.55em 0 0.55em 0; padding-bottom: 0.22em;
  border-bottom: 1.1px solid #8a8a8a; page-break-after: avoid; color: #000;
}
h3 { font-size: 11.2pt; margin: 1.2em 0 0.4em 0; page-break-after: avoid; }
p { margin: 0.5em 0; }
ul, ol { margin: 0.5em 0 0.6em 0; padding-left: 1.55em; }
li { margin: 0.24em 0; }
blockquote {
  margin: 0.8em 0; padding: 0.65em 1em; background: #f6f4ef;
  border-left: 3.2px solid #9c8f77; font-size: 10.1pt;
}
blockquote p { margin: 0.3em 0; }
table { border-collapse: collapse; width: 100%; margin: 0.7em 0; font-size: 9.6pt; page-break-inside: avoid; }
th, td { border: 0.7px solid #999; padding: 3.5px 7px; text-align: left; vertical-align: top; }
th { background: #efede6; font-weight: 600; }
pre {
  background: #f5f4f0; border: 0.7px solid #c9c6bd; padding: 7px 10px;
  font-family: "Menlo", "Consolas", monospace; font-size: 8.7pt; line-height: 1.42;
  overflow-x: hidden; white-space: pre-wrap; page-break-inside: avoid;
  border-radius: 2px;
}
code {
  font-family: "Menlo", "Consolas", monospace; font-size: 0.855em;
  background: #f2f0ea; padding: 0.5px 3px; border-radius: 2px;
}
pre code { background: none; padding: 0; font-size: 0.98em; }
math { font-family: "Latin Modern Math", "Cambria Math", serif; }
math[display="block"] { margin: 0.65em 0; font-size: 105%; }
hr { border: none; border-top: 0.8px solid #bdb9ad; margin: 1.3em 0; }
strong { font-weight: 700; }
a { color: #14120f; text-decoration: none; }
</style>
